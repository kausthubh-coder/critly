<h1>Line length</h1>
<p>Long lines are tiring in a way people rarely put into words. Your eyes jump along a line a few words at a time, then sweep back to the left to find the next one. The longer the line, the longer that sweep, and the easier it is to land on the wrong line when you get there.</p>
