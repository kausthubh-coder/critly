<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrast</title>
<link rel="stylesheet" href="/_base.css">
<style>.list { height: 48px; overflow: auto; } .list p { margin: 0; height: 48px; } .list .faint { color: #f4f4f4; }</style>
</head>
<body>
<main>
<h1>Contrast</h1>
<!-- Only the first row is in view; the faint row is scrolled out of the list, so nobody
     can read it and it isn't checked. -->
<div class="list"><p>First row, in view</p><p class="faint">Second row, scrolled out of view</p></div>
</main>
</body>
</html>
