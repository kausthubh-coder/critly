<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animation</title>
<link rel="stylesheet" href="/_base.css">
<style>@keyframes grow { from { width: 40px; } to { width: 80px; } } .bar { height: 8px; background: var(--foreground); animation: grow 1s ease-in-out infinite alternate; } .panel { transition: height 0.3s ease; }</style>
</head>
<body>
<main>
<h1>Animation</h1>
<div class="bar"></div>
<div class="panel">An accordion panel that animates its height.</div>
</main>
</body>
</html>
